name: 🐛 Bug Report
description: 报告 mtools 中的 Bug 或异常行为
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请填写以下信息帮助我们定位问题。

        提交前请确认：
        - 你正在使用最新版本的 mtools
        - 已在 [已有 Issues](https://github.com/Arweil/mtools/issues?q=is%3Aissue+state%3Aopen+label%3Abug) 中搜索过，未发现相同问题

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 Issues，未发现相同问题
          required: true
        - label: 这是一个独立的 Bug（不同问题请分开提交）
          required: true

  - type: dropdown
    id: package
    attributes:
      label: 所属包
      description: 问题出现在哪个包中？
      options:
        - antd-ext
        - antd-i18n
        - browser-utils
        - isomorphic-utils
        - jaraxxus
        - malganis
        - node-service
        - node-utils
        - mt-template-admin
        - mt-template-h5
        - 其他 / 不确定
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清晰描述遇到了什么问题
      placeholder: |
        例如：使用 LayoutV2 组件时，navigationMode 配置不生效，始终显示默认导航模式。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
      placeholder: navigationMode 设置为 "top" 时，应显示顶部导航模式
    validations:
      required: true

  - type: textarea
    id: error_output
    attributes:
      label: 错误信息/日志
      description: 如有错误信息请粘贴
      placeholder: 粘贴错误输出、堆栈跟踪或相关日志
      render: shell
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 提供可复现的最小步骤和必要代码
      placeholder: |
        1. 安装 antd-ext@1.5.10
        2. 使用以下代码创建页面：
           ```tsx
           <LayoutV2 navigationMode="top">
             <Content />
           </LayoutV2>
           ```
        3. 观察导航栏仍然显示侧边栏模式
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: 是否为回归问题？
      options:
        - 是，之前版本正常
        - 否，一直都有这个问题
        - 不确定
    validations:
      required: true

  - type: input
    id: working_version
    attributes:
      label: 上一个正常版本
      description: 如果是回归问题，哪个版本最后正常？
      placeholder: "例如：antd-ext@1.5.8"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows
        - Ubuntu/Debian Linux
        - 其他 Linux
        - 其他
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: 运行环境
      description: 前端或 Node.js 相关环境
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Node.js
        - 其他
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 截图、配置文件、相关代码等其他有助于排查的信息
    validations:
      required: false
