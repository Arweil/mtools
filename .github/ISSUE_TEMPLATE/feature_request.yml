name: ✨ Feature Request
description: 为 mtools 提出新功能或改进建议
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢提出功能建议！请帮助我们理解你的使用场景。

        提交前请确认：
        - 已在 [已有 Issues](https://github.com/Arweil/mtools/issues?q=is%3Aissue+label%3Aenhancement) 中搜索过，未发现相同请求

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 Issues，未发现相同请求
          required: true
        - label: 这是一个独立的功能请求（多个功能请分开提交）
          required: true

  - type: dropdown
    id: package
    attributes:
      label: 所属包
      description: 该功能针对哪个包？
      options:
        - antd-ext
        - antd-i18n
        - browser-utils
        - isomorphic-utils
        - jaraxxus
        - malganis
        - node-service
        - node-utils
        - mt-template-admin
        - mt-template-h5
        - 跨包 / 整体工程
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 你遇到了什么问题？为什么需要这个功能？请描述你的使用场景，而非解决方案。
      placeholder: |
        例如：当前 antd-ext 的 Table 组件不支持列拖拽排序，在需要频繁调整列顺序的业务场景中很不方便，
        每次都需要手动修改代码重新定义列的顺序。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望这个功能如何工作？
      placeholder: |
        例如：Table 组件新增 columnsDraggable 属性，设为 true 后支持拖拽列头调整顺序，
        拖拽结束后通过 onColumnsChange 回调返回新的列顺序。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你考虑过其他解决方式吗？目前有在用什么临时方案？
      placeholder: 目前通过 dnd-kit 库自行封装实现了类似功能，但维护成本较高。
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 这个功能对你的工作流有多重要？
      options:
        - 关键 - 当前受阻
        - 高 - 显著影响效率
        - 中 - 会很有帮助
        - 低 - 锦上添花
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景示例
      description: 提供一个具体的场景，描述你会在什么时候用到这个功能
      placeholder: |
        场景：
        1. 在后台管理系统中，不同用户对表格列的展示顺序有不同偏好
        2. 用户希望拖拽调整后，列顺序能保存到本地存储
        3. 下次打开页面时自动恢复上次的列顺序
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 截图、设计稿、其他工具的类似功能参考等
    validations:
      required: false
